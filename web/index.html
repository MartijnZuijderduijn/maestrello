<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maestrello</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="modal.css">
<link rel="stylesheet" href="account.css">
</head>
<body>
<header>
  <h1><img src="favicon.svg" alt="" width="22" height="22" class="logo">Maestrello</h1>
  <span id="proj-title" class="proj-title" hidden></span>
  <span id="sandbox" class="sandbox" hidden></span>
  <span class="spacer"></span>
  <button id="proj" class="proj" onclick="toggleProj(event)" aria-haspopup="dialog" aria-expanded="false" title="Choose which projects to show"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span id="proj-label">Projects</span></button>
  <button id="acct" class="acct" onclick="toggleAcct(event)" aria-haspopup="dialog" aria-expanded="false" aria-busy="true"><span class="email off"><span class="skeleton acct" aria-hidden="true"></span><span class="sr-only">checking account…</span></span></button>
  <button class="gear" onclick="openSettings()" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  <button class="primary" id="new-card" onclick="openNew()">New card</button>
</header>
<main class="board" id="board"></main>
<div id="proj-pop" class="proj-pop" role="dialog" aria-label="Projects" hidden></div>
<div id="acct-pop" class="acct-pop" role="dialog" aria-label="Account and usage" hidden></div>
<div id="overlay"><div class="drawer-bg" onclick="closeDrawer()"></div>
  <section class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" tabindex="-1">
    <div class="modal-head"><span id="drawer-av" aria-hidden="true"></span><h3 id="drawer-title"></h3><button class="close" onclick="closeDrawer()">Close</button></div>
    <div class="modal-body" id="drawer-body"></div>
  </section></div>
<div id="picker"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
